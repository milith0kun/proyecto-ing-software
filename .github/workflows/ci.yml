name: CI - Verificación de Requerimientos y Documentación

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-specs-and-tests:
    name: Verificación de Requisitos, Metodología y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Suite de Pruebas de Estructura y Requerimientos
        run: |
          python tests/test_docs_and_structure.py
